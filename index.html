<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored !== null ? stored === 'dark' : systemDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) {
            meta.content = isDark ? 'dark' : 'light';
          }
        } catch (e) {}

        try {
          const storedLang = localStorage.getItem('userLanguage');
          let lang = storedLang;
          if (!lang) {
            const browserLang = (navigator.language || '').toLowerCase();
            lang = browserLang.startsWith('pt') ? 'pt_br' : 'en';
            localStorage.setItem('userLanguage', lang);
          }
          document.documentElement.lang = lang === 'pt_br' ? 'pt-BR' : 'en';
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>João Hartmann - Full Stack Developer | Portfolio</title>
    <meta name="description" content="Portfolio of João Hartmann, a Full Stack Developer specializing in React, Node.js, and cloud technologies. Discover my projects, skills, and experience." />

    <meta property="og:description" content="Portfolio of João Hartmann, a Full Stack Developer specializing in React, Node.js, and cloud technologies." />
    <meta property="og:image" content="https://jhartmann.dev/og-image.jpg" />

    <!-- Twitter -->

  </head>
